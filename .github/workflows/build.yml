# ============================================================
# Compila as aulas Typst -> PDF e empacota os códigos RFO BASIC
#
# Disparo 1: a cada push/PR na branch main
#            -> gera PDFs e o .zip com os códigos como Artifacts
#
# Disparo 2: ao publicar um Release (tag tipo v1.2.0)
#            -> anexa os PDFs e o .zip dos códigos na aba Release
# ============================================================

name: build-aulas-e-codigos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

env:
  SRC_DIR: docs/aulas/src
  OUT_DIR: docs/aulas
  CODE_DIR: codigos

jobs:
  # BUILD 1: Compilação dos PDFs em Typst
  build-pdfs:
    name: Compilar PDFs (Typst)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar o Typst
        uses: typst-community/setup-typst@v3

      - name: Garantir diretório de saída
        run: mkdir -p "${OUT_DIR}"

      - name: Compilar cada aula para PDF
        run: |
          shopt -s nullglob nocaseglob
          files=("${SRC_DIR}"/aula*.typ)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Nenhum arquivo aula*.typ encontrado em ${SRC_DIR}."
          else
            for f in "${files[@]}"; do
              nome=$(basename "${f%.typ}")
              echo "==> Compilando $f -> ${OUT_DIR}/${nome}.pdf"
              typst compile "$f" "${OUT_DIR}/${nome}.pdf"
            done
          fi

      - name: Compilar PDF completo do curso (se apostila.typ existir)
        run: |
          shopt -s nocaseglob
          if [ -f "${SRC_DIR}/apostila.typ" ]; then
            echo "==> Compilando PDF completo"
            typst compile "${SRC_DIR}/apostila.typ" "${OUT_DIR}/apostila-completa.pdf"
          else
            echo "apostila.typ não encontrado - pulando PDF completo."
          fi

      - name: Enviar PDFs como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aulas-pdf
          path: ${{ env.OUT_DIR }}/*.pdf
          if-no-files-found: error

  # BUILD 2: Compactação dos códigos das aulas (pasta codigos/)
  package-code:
    name: Compactar Códigos
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Compactar arquivos de código
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          if [ -d "${CODE_DIR}" ]; then
            cd "${CODE_DIR}"
            zip -r "${GITHUB_WORKSPACE}/dist/codigos-aulas.zip" .
          else
            echo "::error::Diretório ${CODE_DIR} não encontrado!"
            exit 1
          fi

      - name: Enviar Códigos ZIP como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codigos-zip
          path: dist/codigos-aulas.zip
          if-no-files-found: error

  # JOB DE PUBLICAÇÃO: Roda apenas quando um Release é publicado
  publish-release:
    name: Anexar ao Release
    needs: [build-pdfs, package-code]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar PDFs gerados
        uses: actions/download-artifact@v4
        with:
          name: aulas-pdf
          path: release-files/

      - name: Baixar ZIP de códigos
        uses: actions/download-artifact@v4
        with:
          name: codigos-zip
          path: release-files/

      - name: Anexar todos os arquivos ao Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*