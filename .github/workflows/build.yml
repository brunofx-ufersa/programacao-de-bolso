# ============================================================
# Compila as aulas Typst -> PDF e empacota os códigos RFO BASIC
# Nome da pasta gerada para os códigos: curso-ufersa
# ============================================================

name: build-aulas-e-codigos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

env:
  SRC_DIR: docs/aulas/src
  OUT_DIR: docs/aulas
  CODE_DIR: codigos

jobs:
  # BUILD 1: Compilação dos PDFs em Typst
  build-pdfs:
    name: Compilar PDFs (Typst)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar o Typst
        uses: typst-community/setup-typst@v3

      - name: Garantir diretório de saída
        run: mkdir -p "${OUT_DIR}"

      - name: Compilar cada aula para PDF
        run: |
          shopt -s nullglob nocaseglob
          files=("${SRC_DIR}"/aula*.typ)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Nenhum arquivo aula*.typ encontrado em ${SRC_DIR}."
          else
            for f in "${files[@]}"; do
              nome=$(basename "${f%.typ}")
              echo "==> Compilando $f -> ${OUT_DIR}/${nome}.pdf"
              typst compile "$f" "${OUT_DIR}/${nome}.pdf"
            done
          fi

      - name: Compilar PDF completo do curso (se apostila.typ existir)
        run: |
          shopt -s nocaseglob
          if [ -f "${SRC_DIR}/apostila.typ" ]; then
            echo "==> Compilando PDF completo"
            typst compile "${SRC_DIR}/apostila.typ" "${OUT_DIR}/apostila-completa.pdf"
          else
            echo "apostila.typ não encontrado - pulando PDF completo."
          fi

      - name: Enviar PDFs como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aulas-pdf
          path: ${{ env.OUT_DIR }}/*.pdf
          if-no-files-found: error

  # BUILD 2: Preparação da pasta curso-ufersa com os códigos
  package-code:
    name: Preparar Códigos (curso-ufersa)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Organizar códigos na pasta curso-ufersa
        run: |
          mkdir -p curso-ufersa
          if [ -d "${CODE_DIR}" ]; then
            cp -r "${CODE_DIR}"/* curso-ufersa/
          else
            echo "::error::Diretório ${CODE_DIR} não encontrado!"
            exit 1
          fi

      - name: Enviar pasta curso-ufersa como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: curso-ufersa
          path: curso-ufersa/
          if-no-files-found: error

  # JOB DE PUBLICAÇÃO: Roda apenas quando publicar uma Release
  publish-release:
    name: Anexar ao Release
    needs: [build-pdfs, package-code]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar PDFs gerados
        uses: actions/download-artifact@v4
        with:
          name: aulas-pdf
          path: release-files/

      - name: Baixar pasta de códigos curso-ufersa
        uses: actions/download-artifact@v4
        with:
          name: curso-ufersa
          path: release-files/curso-ufersa/

      - name: Compactar curso-ufersa.zip para o Release
        run: |
          cd release-files
          zip -r curso-ufersa.zip curso-ufersa/
          rm -rf curso-ufersa

      - name: Anexar todos os arquivos ao Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*