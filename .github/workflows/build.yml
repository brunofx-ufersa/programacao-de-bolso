
# ============================================================
# Compila aulas Typst -> PDF e empacota os recursos hBasic
#
# Pacotes:
#   aulas.zip        -> PDFs das aulas (BROWSER)
#   curso-ufersa.zip -> códigos .bas (source/)
#   assets-curso.zip -> assets do curso (data/)
# ============================================================

name: build-aulas-e-codigos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

env:
  SRC_DIR: docs/aulas/src
  CMP_DIR: docs/aulas/complementar
  OUT_DIR: aulas-pdf
  CODE_DIR: codigos
  ASSETS_DIR: assets

jobs:

  # ==========================================================
  # BUILD 1: Compilação dos PDFs em Typst
  # ==========================================================
  build-pdfs:
    name: Compilar PDFs (Typst)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar o Typst
        uses: typst-community/setup-typst@v3

      - name: Garantir diretório de saída
        run: mkdir -p "${OUT_DIR}"

      - name: Instalar fonte Inter
        run: |
          mkdir -p ~/.local/share/fonts
          wget -O /tmp/Inter.zip \
            https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          unzip -o /tmp/Inter.zip -d /tmp/inter
          find /tmp/inter -type f -name "*.ttf" \
            -exec cp {} ~/.local/share/fonts/ \;
          fc-cache -f
  
      - name: Compilar cada aula para PDF
        run: |
          shopt -s nullglob nocaseglob
          files=("${SRC_DIR}"/aula*.typ)

          if [ ${#files[@]} -eq 0 ]; then
            echo "Nenhum arquivo aula*.typ encontrado."
          else
            for f in "${files[@]}"; do
              nome=$(basename "${f%.typ}")
              echo "==> Compilando $f"
              typst compile "$f" "${OUT_DIR}/${nome}.pdf"
            done
          fi
 
      - name: Compilar cada aula complementar para PDF
        run: |
          shopt -s nullglob nocaseglob
          files=("${CMP_DIR}"/complementar*.typ)

          if [ ${#files[@]} -eq 0 ]; then
            echo "Nenhum arquivo complementar*.typ encontrado."
          else
            for f in "${files[@]}"; do
              nome=$(basename "${f%.typ}")
              echo "==> Compilando $f"
              typst --root . compile "$f" "${OUT_DIR}/${nome}.pdf"
            done
          fi

      - name: Compilar PDF completo do curso
        run: |
          shopt -s nocaseglob
          if [ -f "${SRC_DIR}/apostila.typ" ]; then
            echo "==> Compilando apostila completa"
            typst compile "${SRC_DIR}/apostila.typ" \
              "${OUT_DIR}/apostila-completa.pdf"
          else
            echo "apostila.typ não encontrado."
          fi

      - name: Enviar PDFs como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aulas-pdf
          path: ${{ env.OUT_DIR }}/*.pdf
          if-no-files-found: error

      # Atualiza os PDFs compilados no repositório
      #- name: Atualizar PDFs no repositório
      #  if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #  run: |
      #    git config user.name "github-actions[bot]"
      #    git config user.email \
      #      "41898282+github-actions[bot]@users.noreply.github.com"#


      #    git add "${OUT_DIR}"/*.pdf

       #   if git diff --cached --quiet; then
       #     echo "Nenhum PDF foi alterado."
       #   else
       #     git commit -m "Atualiza PDFs compilados"
       #     git push
       #   fi

  # ==========================================================
  # BUILD 2: Preparação dos códigos .bas
  # ==========================================================
  package-code:
    name: Preparar Códigos (curso-ufersa)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Organizar códigos na pasta curso-ufersa
        run: |
          mkdir -p curso-rfo

          if [ ! -d "${CODE_DIR}" ]; then
            echo "::error::Diretório ${CODE_DIR} não encontrado!"
            exit 1
          fi

          # Copia somente arquivos BASIC (.bas)
          find "${CODE_DIR}" -type f -iname "*.bas" \
            -exec cp --parents {} curso-rfo/ \;

      - name: Enviar códigos como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: curso-rfo
          path: curso-rfo/
          if-no-files-found: error

  # ==========================================================
  # BUILD 3: Preparação dos assets
  # ==========================================================
  package-assets:
    name: Preparar Assets do Curso
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Verificar e organizar assets
        run: |
          mkdir -p assets-rfo

          if [ -d "${ASSETS_DIR}" ]; then
            cp -a "${ASSETS_DIR}/." assets-rfo/
          else
            echo "Diretório ${ASSETS_DIR} ainda não existe."
            echo "Criando pacote vazio."
          fi

          zip -r assets-rfo.zip assets-rfo/
      - name: Enviar assets como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-rfo
          path: assets-rfo/
          if-no-files-found: warn

  # ==========================================================
  # JOB DE PUBLICAÇÃO: Executado ao publicar uma Release
  # ==========================================================
  publish-release:
    name: Publicar pacotes na Release
    needs: [build-pdfs, package-code, package-assets]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar PDFs gerados
        uses: actions/download-artifact@v4
        with:
          name: aulas-pdf
          path: release-files/aulas/

      - name: Baixar códigos
        uses: actions/download-artifact@v4
        with:
          name: curso-rfo
          path: release-files/curso-rfo/

      - name: Baixar assets
        uses: actions/download-artifact@v4
        with:
          name: assets-rfo
          path: release-files/assets-rfo/

      - name: Gerar ZIP das aulas
        run: |
          cd release-files/aulas
          zip -j ../aulas-rfo.zip *.pdf

      - name: Gerar ZIP dos códigos
        run: |
          cd release-files
          zip -r curso-rfo.zip curso-rfo/

      - name: Gerar ZIP dos assets
        run: |
          cd release-files
          zip -r assets-rfo.zip assets-rfo/

      - name: Gerar catálogo de pacotes
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          cat > release-files/catalogo.txt << EOF
          # PROGRAMACAO DE BOLSO
          # id|descricao|arquivo|destino|categoria

          versao|${VERSION}
          codigos|Codigos das aulas|curso-rfo.zip|source/|codigo
          assets|Recursos do curso|assets-rfo.zip|data/|assets
          EOF

      - name: Anexar arquivos ao Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/aulas-rfo.zip
            release-files/curso-rfo.zip
            release-files/assets-rfo.zip
            release-files/catalogo.txt
