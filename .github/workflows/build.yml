# ============================================================
# Compila as aulas Typst -> PDF automaticamente
#
# Disparo 1: a cada push/PR na branch main
#            -> compila cada aula e anexa os PDFs como Artifact
#
# Disparo 2: ao publicar um Release (tag tipo v1.2.0)
#            -> publica os PDFs na aba Releases
#
# Estrutura esperada:
#   docs/aulas/src/aula01.typ, aula02.typ ... aula10.typ
#   docs/aulas/src/apostila.typ  (opcional, junta tudo num PDF só)
# ============================================================

name: build-aulas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

env:
  SRC_DIR: docs/aulas/src
  OUT_DIR: docs/aulas

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar o Typst
        uses: typst-community/setup-typst@v3

      - name: Garantir diretório de saída
        run: mkdir -p "${OUT_DIR}"

      - name: Compilar cada aula para PDF
        run: |
          shopt -s nullglob
          files=("${SRC_DIR}"/aula*.typ)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Nenhum arquivo aula*.typ encontrado em ${SRC_DIR}."
          else
            for f in "${files[@]}"; do
              nome=$(basename "${f%.typ}")
              echo "==> Compilando $f -> ${OUT_DIR}/${nome}.pdf"
              typst compile "$f" "${OUT_DIR}/${nome}.pdf"
            done
          fi

      - name: Compilar PDF completo do curso (se apostila.typ existir)
        run: |
          if [ -f "${SRC_DIR}/apostila.typ" ]; then
            echo "==> Compilando PDF completo"
            typst compile "${SRC_DIR}/apostila.typ" "${OUT_DIR}/apostila-completa.pdf"
          else
            echo "apostila.typ não encontrado - pulando PDF completo."
          fi

      - name: Enviar PDFs como Artifact (Actions > runs)
        uses: actions/upload-artifact@v4
        with:
          name: aulas-pdf
          path: ${{ env.OUT_DIR }}/*.pdf
          if-no-files-found: error

      - name: Anexar PDFs ao Release (quando disparado por release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUT_DIR }}/*.pdf